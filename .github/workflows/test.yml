name: Continuous Integration

on: [push, pull_request, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install dosbox
    - name: Build and test
      timeout-minutes: 10
      run: ./test.sh
